[project]
name = "temp-mail-backend"
version = "1.0.0"
description = "临时邮箱工具站后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "aiosmtpd==1.4.6",
    "redis[hiredis]==5.2.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.12",
    "bleach==6.2.0",
    "loguru==0.7.3",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
